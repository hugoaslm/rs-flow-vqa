# Fast Smoke Test Configuration for CPU / Mock GPU validation

experiment_name: "smoke_aligned_v3"
seed: 42
device: "cpu"
precision: "fp32"
output_dir: "./outputs/smoke_aligned_v3"
cache_dir: "./data/smoke_cache_aligned_v3"

models:
  vision_backbone: "scale_mae_vit_l"
  vision_dim: 1024
  llm_backbone: "Qwen/Qwen2.5-1.5B-Instruct"
  llm_dim: 1536
  max_caption_length: 16
  prefix_tokens: 8
  spatial_grid_size: 4
  spatial_tokens: 16
  latent_tokens: 4
  latent_dim: 32
  fixed_gsd: 1.0

visual_bridge:
  type: "query_resampler"
  num_heads: 4
  mlp_ratio: 4
  dropout: 0.0
  pooled_hidden_dim: 64
  pooled_layers: 1
  query_layers: 2
  qformer_layers: 3

bridge:
  hidden_dim: 32
  num_layers: 2
  num_heads: 4
  mlp_dim: 64
  dropout: 0.0

alignment:
  cache_batch_size: 4
  cache_num_workers: 0
  prompt_batch_size: 4
  prompt_grad_accum_steps: 1
  prompt_epochs: 1
  prompt_lr: 0.001
  prefix_norm_weight: 0.001
  visual_batch_size: 4
  visual_epochs: 1
  visual_lr: 0.001
  visual_lm_updates: 2
  visual_lm_batch_size: 2
  visual_lm_grad_accum_steps: 1
  visual_lm_lr: 0.001
  visual_shuffle_margin: 0.05
  visual_shuffle_weight: 0.1
  visual_contrastive_weight: 0.05
  visual_latent_weight: 0.05
  visual_lm_validation_interval: 1
  visual_validation_batch_size: 2
  visual_validation_images: 4
  qwen_4bit: false
  gate_prompt_nll_gain: -1.0
  gate_visual_nll_gap: -1.0

teacher:
  batch_size: 4
  grad_accum_steps: 1
  total_steps: 20
  lr: 0.001
  warmup_steps: 5
  weight_decay: 0.01
  grad_clip: 1.0
  coupling: "ot"
  high_noise_probability: 0.5
  high_noise_beta_alpha: 3.0
  condition_rank_weight: 0.1
  condition_rank_probability: 0.25
  min_condition_gap: -1.0
  evaluation_nfes: [4, 8]

distillation:
  batch_size: 4
  grad_accum_steps: 1
  total_steps: 20
  student_lr: 0.0003
  auxiliary_lr: 0.001
  adam_betas: [0.9, 0.99]
  ema_decay: 0.99
  n_intervals: 4
  k_norm_exp: 1.0
  alpha_corr: 0.3
  corr_delay_ratio: 0.10
  corr_warmup_ratio: 0.10
  pred_prob: 0.75
  min_teacher_condition_gap: -1.0
  min_student_teacher_cosine: -1.0

data:
  rsicd_data_dir: "./data/RSICD"
  rsvqa_data_dir: "./data/RSVQA_LR"
  captions_per_image: 5

evaluation:
  caption_num_images: 4
  generation_batch_size: 2
  rsvqa_subset_fraction: 0.10
  eval_seeds: [42]
