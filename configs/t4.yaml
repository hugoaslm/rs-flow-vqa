# Configuration for Single NVIDIA T4 GPU Training (16 GB VRAM)

experiment_name: "t4_aligned_v3_qwen15b"
seed: 42
device: "cuda"
precision: "fp16"
output_dir: "./outputs/t4_aligned_v3_qwen15b"
cache_dir: "./data/cache_aligned_v3_qwen15b"

models:
  vision_backbone: "scale_mae_vit_l"
  vision_dim: 1024
  llm_backbone: "Qwen/Qwen2.5-1.5B-Instruct"
  llm_dim: 1536
  max_caption_length: 32
  prefix_tokens: 16
  spatial_grid_size: 4  # ablations: 4, 7, 14
  spatial_tokens: 16  # must equal spatial_grid_size squared
  latent_tokens: 8
  latent_dim: 256
  fixed_gsd: 1.0  # Default GSD for RSICD

visual_bridge:
  type: "query_resampler"  # pooled_mlp | query_resampler | qformer_resampler
  num_heads: 4
  mlp_ratio: 4
  dropout: 0.0
  pooled_hidden_dim: 512
  pooled_layers: 3
  query_layers: 2
  qformer_layers: 6

alignment:
  cache_batch_size: 64  # L4-friendly; use 16 on a T4
  cache_num_workers: 4
  prompt_batch_size: 4  # L4-friendly; use 1 on a T4
  prompt_grad_accum_steps: 4  # effective batch: 16
  prompt_epochs: 2
  prompt_lr: 0.0002
  prefix_norm_weight: 0.001
  visual_batch_size: 128
  visual_epochs: 20  # latent-alignment warm start
  visual_lr: 0.0003
  visual_lm_updates: 0  # 0 for clean latent alignment; >0 for LM fine-tuning
  visual_lm_batch_size: 4  # L4-friendly; use 2 on a T4
  visual_lm_grad_accum_steps: 2  # effective batch: 8
  visual_lm_lr: 0.00003
  visual_shuffle_margin: 0.05
  visual_shuffle_weight: 0.1
  visual_contrastive_weight: 0.05
  visual_latent_weight: 0.05
  visual_lm_validation_interval: 16
  visual_validation_batch_size: 16  # L4-friendly; use 8 on a T4
  visual_validation_images: 64
  qwen_4bit: true
  gate_prompt_nll_gain: 0.05
  gate_visual_nll_gap: 0.02

bridge:
  hidden_dim: 384
  num_layers: 6
  num_heads: 6
  mlp_dim: 1536
  dropout: 0.1

teacher:
  batch_size: 128
  grad_accum_steps: 1
  total_steps: 8000  # optimizer updates; each uses grad_accum_steps microbatches
  lr: 0.0002
  warmup_steps: 1000
  weight_decay: 0.01
  grad_clip: 1.0
  coupling: "ot"  # "ot" or "independent"
  high_noise_probability: 0.5
  high_noise_beta_alpha: 3.0
  condition_rank_weight: 0.1
  condition_rank_probability: 0.25
  min_condition_gap: 0.05
  evaluation_nfes: [16, 32]

distillation:
  batch_size: 64
  grad_accum_steps: 1
  total_steps: 5000  # optimizer updates
  student_lr: 0.00003
  auxiliary_lr: 0.0001
  adam_betas: [0.9, 0.99]
  ema_decay: 0.999
  n_intervals: 8
  k_norm_exp: 1.0
  alpha_corr: 0.3
  corr_delay_ratio: 0.10
  corr_warmup_ratio: 0.10
  pred_prob: 0.75
  min_teacher_condition_gap: 0.05
  min_student_teacher_cosine: 0.95

data:
  rsicd_data_dir: "./data/RSICD"
  rsvqa_data_dir: "./data/RSVQA_LR"
  captions_per_image: 5

evaluation:
  caption_num_images: 200
  generation_batch_size: 16  # L4-friendly; reduce to 8 if using a T4
  rsvqa_subset_fraction: 0.10
  eval_seeds: [42, 100, 2024]
