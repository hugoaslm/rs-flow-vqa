[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-flow-vqa"
version = "0.1.0"
description = "RS-Flow-VQA: Conditional Flow Matching and FreeFlow Distillation for Remote Sensing VQA"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pillow>=9.0.0",
    "requests>=2.28.0"
]

[tool.setuptools.packages.find]
include = ["rs_flow_vqa*"]

[project.optional-dependencies]
gpu = [
    "torchgeo>=0.6.0,<0.7.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0"
]
notebook = [
    "pandas>=2.0.0",
    "jupyter>=1.0.0"
]

[dependency-groups]
dev = [
    "pytest>=7.0.0"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
rs-flow-vqa = "rs_flow_vqa.cli:main"
